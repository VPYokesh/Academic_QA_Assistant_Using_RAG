[project]
name = "rag-qa-assistant"
version = "1.0.0"
description = "RAG-powered Academic QA Assistant with Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"

# Dependencies are managed via requirements.txt for standard venv compatibility.
# See requirements.txt for the full dependency list.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
